name: Native Windows OCCT Evidence

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  native-windows:
    name: Pinned OCCT worker and desktop smoke
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Check out PartProbe
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Check out exact OCCT source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: Open-Cascade-SAS/OCCT
          ref: d3056ef80c9668f395da40f5fd7be186cae4501f
          fetch-depth: 0
          path: native-input/occt-source
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.94.1 --profile minimal --component clippy

      - name: Select pinned Rust toolchain
        run: rustup default 1.94.1

      - name: Fetch locked Rust dependencies
        run: cargo fetch --locked

      - name: Construct and verify pinned OCCT worker
        run: >-
          python scripts/build_occt.py
          --source native-input/occt-source
          --build "$env:RUNNER_TEMP\partprobe-occt-build"
          --install "$env:RUNNER_TEMP\partprobe-occt-install"
          --generator "Visual Studio 17 2022"
          --architecture x64
          --jobs 2

      - name: Assemble and verify Windows developer runtime
        run: |
          python scripts/assemble_native_runtime.py assemble `
            --occt-root "$env:RUNNER_TEMP\partprobe-occt-install" `
            --worker target\debug\partprobe-geometry-worker.exe `
            --build-manifest "$env:RUNNER_TEMP\partprobe-occt-build\partprobe-occt-build-manifest.json" `
            --output "$env:RUNNER_TEMP\partprobe-native-runtime"
          python scripts/assemble_native_runtime.py verify `
            --runtime-root "$env:RUNNER_TEMP\partprobe-native-runtime"

      - name: Verify Windows dynamic-link closure
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path -LiteralPath $vswhere -PathType Leaf)) {
            throw "vswhere.exe is unavailable"
          }
          $installation = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $installation) {
            throw "the Visual C++ toolchain is unavailable"
          }
          $dumpbin = Get-ChildItem `
            -Path "$installation\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" `
            -File | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $dumpbin) {
            throw "dumpbin.exe is unavailable"
          }
          python scripts/verify_native_runtime_links.py `
            --runtime-root "$env:RUNNER_TEMP\partprobe-native-runtime" `
            --dependency-tool $dumpbin.FullName

      - name: Run configured native desktop smoke
        env:
          PARTPROBE_NATIVE_RUNTIME: ${{ runner.temp }}\partprobe-native-runtime
          PARTPROBE_GEOMETRY_WORKSPACE: ${{ runner.temp }}\partprobe-gui-worker
        run: |
          New-Item -ItemType Directory -Path $env:PARTPROBE_GEOMETRY_WORKSPACE | Out-Null
          cargo test `
            -p partprobe-estimator-desktop `
            --features desktop-host `
            gui5_configured_worker_runs_real_step_through_retained_estimate_session `
            --locked -- --ignored --nocapture

      - name: Confirm PartProbe checkout remains unchanged
        run: |
          git diff --exit-code
          git diff --cached --exit-code
