name: Rust CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.94.1 --profile minimal --component clippy,rustfmt

      - name: Select pinned Rust toolchain
        run: rustup default 1.94.1

      - name: Install pinned WASM target
        run: rustup target add wasm32-unknown-unknown

      - name: Refresh Linux package index for desktop build
        if: runner.os == 'Linux'
        run: sudo apt-get update

      - name: Install Linux desktop build prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get install --yes libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Fetch locked dependencies
        run: cargo fetch --locked

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Test native tooling scripts
        run: python -m unittest discover -s scripts/tests -p "test_*.py"

      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Lint Leptos WASM frontend
        run: cargo clippy -p partprobe-estimator-desktop-ui --target wasm32-unknown-unknown --locked -- -D warnings

      - name: Lint Tauri desktop host
        run: cargo clippy -p partprobe-estimator-desktop --features desktop-host --all-targets --locked -- -D warnings

      - name: Test all targets
        run: cargo test --workspace --all-targets --locked

      - name: Test documentation
        run: cargo test --workspace --doc --locked
