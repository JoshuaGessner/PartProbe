[package]
name = "partprobe-estimator-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
build = "build.rs"

[features]
default = []
desktop-host = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-dialog"]

[dependencies]
partprobe-application.workspace = true
partprobe-desktop-contract.workspace = true
partprobe-domain.workspace = true
partprobe-geometry-core.workspace = true
partprobe-geometry-import.workspace = true
partprobe-security.workspace = true
serde_json.workspace = true
tauri = { workspace = true, optional = true }
tauri-plugin-dialog = { workspace = true, optional = true }

[build-dependencies]
tauri-build = { workspace = true, optional = true }

[[bin]]
name = "partprobe-estimator-desktop"
path = "src/main.rs"
required-features = ["desktop-host"]

[lints]
workspace = true
